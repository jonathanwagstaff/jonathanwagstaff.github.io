            <h1>Contact Us</h1>
    </header>
    <main>
        <p>Have questions or want to get in touch with the DAS Weapons Club? Fill out the form below and we'll get back to you as soon as possible!</p>

        <form action="submit.html" method="post">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" title="name">
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" title="email">
            </div>

            <div>
                <label for="message">Please put your message here:</label><br>
                <textarea title="message" id="message"></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </main>
